name: Release checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    name: Runtime / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.11.2'
          python-version: ${{ matrix.python }}
      - name: Install the locked environment
        run: uv sync --locked --project public-facing/runtime
      - name: Test the runtime
        run: uv run --locked --project public-facing/runtime pytest public-facing/runtime/tests
      - name: Run the fictional first-use demonstration
        run: uv run --locked --project public-facing/runtime sherlock --data-dir "${{ runner.temp }}/sherlock-ci" demo

  distribution:
    name: Public distribution
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.11.2'
          python-version: '3.13'
      - name: Test public packaging controls
        run: uv run --no-project python -m unittest discover -s tests -v
      - name: Build the public allowlisted package
        run: uv run --no-project python scripts/package_release.py
      - name: Check distribution files, sensitive patterns, and local links
        run: uv run --no-project python scripts/release_check.py dist/agent-sherlock
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agent-sherlock-reviewed-source
          path: |
            dist/agent-sherlock.zip
            dist/agent-sherlock-sha256.json
          if-no-files-found: error
          retention-days: 14
